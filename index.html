<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klorix CV Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Poppins:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--bg:#eef0f4;--pn:#fff;--tx:#1d2433;--mu:#667085;--bd:#d9dde5;--pr:#2f3a4f}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Hind Siliguri','Poppins',sans-serif}
.app{display:grid;grid-template-columns:420px 1fr;height:100vh}
#side{background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:16px 16px 90px}
#stage{overflow:auto;padding:18px 12px 90px;display:flex;flex-direction:column;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 14px}.brand .lg{width:36px;height:36px;border-radius:8px;background:#2f3a4f;color:#fff;font:700 20px/36px Poppins,sans-serif;text-align:center;flex:none}.brand img{height:36px;width:auto;max-width:96px;object-fit:contain}h2{font-size:18px;margin:0;font-weight:700}
details{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:#fff}
summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
summary::after{content:"+";float:right;color:var(--mu)}
details[open] summary::after{content:"−"}
.bd{padding:4px 14px 14px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,textarea{width:100%;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;color:var(--tx);background:#fff}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid #3b6fd4;outline-offset:1px}
input[type=color]{padding:2px;height:38px}
input[type=range]{padding:0}
.row{border:1px dashed var(--bd);border-radius:8px;padding:2px 10px 10px;margin-top:10px;position:relative}
.x{position:absolute;right:6px;top:6px;border:0;background:#fde8e8;color:#b42318;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:16px}
.add{margin-top:10px;width:100%;padding:8px;border:1px dashed #3b6fd4;color:#3b6fd4;background:#f3f7ff;border-radius:8px;cursor:pointer;font:inherit}
.tpl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tpl i{height:48px!important}
.tpl button{border:2px solid var(--bd);background:#fff;border-radius:8px;padding:5px 2px;cursor:pointer;font:inherit;font-size:11px;position:relative}
.tpl button.on{border-color:#3b6fd4;background:#f3f7ff;font-weight:600}
.tpl i{display:block;height:34px;border-radius:4px;margin-bottom:3px}
.tpl .bdg{position:absolute;top:3px;right:3px;background:#10b981;color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;letter-spacing:.3px}
.photo{display:flex;gap:8px;align-items:center}
.photo button,.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.sec2{background:#eef0f4;color:var(--tx)}
.pri{background:var(--pr);color:#fff}
.bar{position:fixed;left:0;bottom:0;width:420px;background:#fff;border-top:1px solid var(--bd);padding:10px 16px;display:flex;gap:8px;z-index:5}
.bar .btn{flex:1}
#box{position:relative}
#cv{transform-origin:0 0;position:absolute;left:0;top:0;box-shadow:0 6px 24px rgba(20,30,50,.18)}
.tabs{display:none}
@media(max-width:900px){
 .app{display:block;height:auto}
 #side,#stage{height:calc(100vh - 56px);border:0}
 .bar{width:100%;bottom:56px}
 .tabs{display:flex;position:fixed;left:0;bottom:0;width:100%;height:56px;background:#fff;border-top:1px solid var(--bd);z-index:6}
 .tabs button{flex:1;border:0;background:#fff;font:inherit;font-weight:600;color:var(--mu)}
 .tabs button.on{color:#3b6fd4;box-shadow:inset 0 3px #3b6fd4}
 body.v-edit #stage,body.v-view #side{display:none}
 body.v-view .bar{display:none}
}

/* ===== CV BASE ===== */
.cv{width:794px;min-height:1123px;background:#fff;display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;font:13px/1.5 'Poppins','Hind Siliguri',sans-serif;color:#222;--sb:#2f3a4f;--sf:#fff;--h:#2f3a4f}
.cv .ph{grid-area:1/1;background:var(--sb);padding:36px 0 14px;display:flex;justify-content:center}
.cv .hd{grid-area:1/2;padding:50px 36px 14px}
.cv .sd,.cv .mn{display:flex;flex-direction:column;justify-content:space-between;font-size:calc(13px*var(--k,1))}
.cv .sd{grid-area:2/1;background:var(--sb);color:var(--sf);padding:10px 24px 30px}
.cv .mn{grid-area:2/2;padding:10px 36px 30px}
.pic{width:150px;height:150px;border-radius:50%;border:5px solid var(--a);background:#94a3b8 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:600;color:#fff}
.hd h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;text-transform:uppercase;color:var(--h)}
.hd p{letter-spacing:3px;text-transform:uppercase;color:var(--a);margin:8px 0 0;font-size:12px;font-weight:500}
.sec{margin-bottom:1.3em}
.sec h3{font-size:1.08em;text-transform:uppercase;letter-spacing:1.5px;margin:0 0 .7em;padding-bottom:4px;border-bottom:2px solid var(--a);font-weight:600}
.sd .sec h3{color:var(--sf)}
.mn .sec h3{color:var(--h)}
.it{margin-bottom:.8em}
.it b{display:block;font-weight:600}
.it i{font-style:normal;color:#666;font-size:.885em}
.it p{margin:2px 0 0;font-size:.92em;white-space:pre-line}
.sd .it i{color:inherit;opacity:.75}
.bl{position:relative;padding-left:1.1em;font-size:.92em;margin:.2em 0;word-break:break-word}
.bl::before{content:"";position:absolute;left:.15em;top:.62em;width:.32em;height:.32em;border-radius:50%;background:var(--a)}
.ct div{margin-bottom:.5em;font-size:.92em;word-break:break-word}
.ct small{display:block;color:var(--a);font-size:.77em;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.sb{height:.4em;background:rgba(128,128,128,.35);border-radius:3px;margin-top:4px}
.sb span{display:block;height:100%;background:var(--a);border-radius:3px}
.about{white-space:pre-line;font-size:.96em}
.ic,.shape{display:none}

/* t1 rounded corners */
.t1 .ph{margin-bottom:14px;border-radius:0 0 70px 0}.t1 .sd{border-top-right-radius:60px;padding-top:24px}.t1 .pic{border-color:#cfd8e3}

/* t2 dark + orange (FIXED RING OVERLAP) */
.t2{--sb:#262626;--h:#262626}
.t2 .ph{padding:44px 0 32px}
.t2 .pic{border:0;width:146px;height:146px;box-shadow:0 0 0 7px var(--sb),0 0 0 14px var(--a)}
.t2 .sd{padding-top:16px}
.t2 .mn .sec h3{background:#262626;color:#fff;border:0;padding:6px 16px 6px 36px;margin-left:-36px;border-radius:0 24px 24px 0}
.t2 .hd h1{font-size:34px}
.t2 .mn .it{border-left:2px solid #d1d5db;padding-left:14px;margin-left:4px}

/* t3 navy – reference CV layout */
.t3{--sb:#fff;--sf:#1d2433;--h:var(--a);grid-template-rows:auto auto 1fr}
.t3 .ph{grid-area:1/1;background:#fff;position:relative;padding:30px 0 28px;overflow:visible}
.t3 .hd{grid-area:2/1;padding:0 14px 14px 22px}
.t3 .sd{grid-area:3/1;background:#f1f5fd;margin:4px 10px 16px 8px;border-radius:12px;padding:16px 14px 18px 14px}
.t3 .mn{grid-area:1/2/4/3;padding:38px 34px 28px 22px}
.t3 .shape{display:block;position:absolute;left:0;top:0;width:276px;height:100%;z-index:0}
.shape .n{fill:var(--h)}
.shape .a{fill:none;stroke:#c7d5f2;stroke-width:9;stroke-linecap:round}
.t3 .pic{position:relative;z-index:1;width:204px;height:204px;border:6px solid #fff;box-shadow:0 3px 14px rgba(11,42,122,.28)}
.t3 .hd h1{font:600 29px/1.05 'Oswald','Poppins',sans-serif;letter-spacing:.5px;color:var(--h)}
.t3 .hd p{color:#667085;letter-spacing:1.5px;font-size:10.5px;margin:5px 0 0}
.c3{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.c3 div{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.35;word-break:break-word}
.c3 svg{width:16px;height:16px;fill:var(--h);flex:none;margin-top:1px}
.c3 b{font-weight:700;color:#1d2433}
.t3 .sec h3{display:flex;align-items:center;gap:calc(var(--k,1)*9px);background:none;border:0;padding:0;margin:0 0 calc(var(--k,1)*10px);color:var(--h)!important;text-align:left;font:500 calc(var(--k,1)*18px)/1.05 'Oswald','Poppins',sans-serif;letter-spacing:.4px}
.t3 .mn .sec h3{font-size:calc(var(--k,1)*23px);gap:calc(var(--k,1)*10px)}
.t3 .ic{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--h);flex:none;width:calc(var(--k,1)*29px);height:calc(var(--k,1)*29px)}
.t3 .mn .ic{width:calc(var(--k,1)*35px);height:calc(var(--k,1)*35px)}
.t3 .ic svg{width:54%;height:54%;fill:#fff}
.t3 .mn .sec>:not(h3){margin-left:calc(var(--k,1)*45px)}
.t3 .it b{color:var(--h)}
.t3 .mn .it i{font-style:italic}
.t3 .sb span{background:var(--h)}

/* t4 yellow, right sidebar */
.t4{grid-template-columns:1fr 260px;--sb:#2b2b2b;--h:#fff}
.t4 .ph{grid-area:1/2}.t4 .hd{grid-area:1/1;background:var(--a);color:#fff;padding-top:60px}
.t4 .hd p{color:#fff;opacity:.9}.t4 .sd{grid-area:2/2}.t4 .mn{grid-area:2/1}
.t4 .mn .sec h3{background:var(--a);color:#2b2b2b;border:0;padding:5px 14px;letter-spacing:3px}
.t4 .sd .sec h3{border:1px solid var(--a);padding:6px 10px;text-align:center}

/* t5 timeline */
.t5{--sb:#2c2c2e;--h:#2c2c2e}
.t5 .hd h1{letter-spacing:2px;font-size:32px}
.t5 .mn .sec h3{border:0;border-left:5px solid var(--a);padding:2px 0 2px 10px;background:#f3f4f6}
.t5 .mn .it{border-left:2px solid #d1d5db;padding-left:14px;margin-left:5px;position:relative}
.t5 .mn .it::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--a)}
.t5 .ph{border-bottom:6px solid var(--a)}
.t5 .sd .sec h3{border-bottom:1px solid rgba(255,255,255,.3)}

/* t6 diagonal */
.t6{--sb:#2b2b2b;--h:#2b2b2b}
.t6 .ph{background:linear-gradient(135deg,var(--a) 0 38%,#2b2b2b 38%)}
.t6 .pic{border:5px solid #fff;border-radius:50% 50% 50% 10px}
.t6 .hd{background:#f1f1f1;border-left:6px solid var(--a);margin:44px 0 10px;padding:18px 28px}
.t6 .hd p{color:#666}
.t6 .sd .sec h3{border:0;border-left:4px solid var(--a);padding-left:8px}
.t6 .mn .sec h3{border:0;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px}
.t6 .mn .sec h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--a)}

/* t7 wave */
.t7{--sb:#2b2b2b;--h:#fff}
.t7 .hd{background:#2b2b2b;color:#fff;border-bottom-left-radius:90px;padding:50px 36px 36px}
.t7 .hd p{color:var(--a)}
.t7 .pic{border:4px solid #fff;outline:4px solid var(--a)}
.t7 .mn .sec h3{color:#2b2b2b;border-bottom:1px solid #999;font-weight:700}
.t7 .sd .sec h3{border-bottom:1px solid var(--a)}
.t7 .mn{padding-top:22px}

/* t8 clean light */
.t8{--sb:#eef1f5;--sf:#1d2433;--h:#0f172a}
.t8 .sd .it i{color:#555}
.t8 .pic{border-color:#fff;box-shadow:0 0 0 3px var(--a)}
.t8 .hd h1{font-size:34px;text-transform:none;letter-spacing:-.5px}
.t8 .mn .sec h3{border:0;border-left:4px solid var(--a);padding-left:10px;color:var(--a)}
.t8 .sd .sec h3{border:0;color:var(--a)}

/* ===== ATS FRIENDLY TEMPLATES (t9 - t12) ===== */
.cv.ats{display:flex;flex-direction:column;padding:42px 48px;color:#111827;--h:var(--a)}
.cv.ats .sd,.cv.ats .mn{background:none;color:inherit;padding:0;display:block}
.cv.ats .mn{order:2}
.cv.ats .sd{order:3}
.cv.ats .sec{margin-bottom:1.15em}
.cv.ats .sec h3{color:var(--a);border-bottom:1.5px solid var(--a);padding-bottom:3px;margin-bottom:.55em;font-size:1.05em;letter-spacing:1.2px;font-weight:700}
.cv.ats .sd .sec:first-child{display:none}
.cv.ats .ats-c{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.9em;color:#374151;margin-top:8px}
.cv.ats .ats-c span:not(:last-child)::after{content:"•";margin-left:14px;color:var(--a);font-weight:700}
.cv.ats .it-hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cv.ats .it-hd b{font-size:1em;color:#111827}
.cv.ats .it-hd span{font-size:.88em;color:#4b5563;font-weight:600;white-space:nowrap}
.cv.ats .it i{display:block;color:#374151;font-style:italic;margin-bottom:2px}
.cv.ats .sd .sec{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline}
.cv.ats .sd .sec h3{width:100%;margin-bottom:.4em}
.cv.ats .sd .sec .bl{width:calc(50% - 10px);margin:.12em 0}
.cv.ats .sd .sec .it{margin-bottom:.4em;width:calc(50% - 10px)}
.cv.ats .sd .sec .it.fw{width:100%}
.cv.ats .sb{display:none}

/* t9: ATS Classic (Text Only - Centered Harvard Style) */
.t9 .ph{display:none}
.t9 .hd{padding:0 0 14px;text-align:center;border-bottom:2px solid var(--a);margin-bottom:16px}
.t9 .hd h1{font-size:28px;letter-spacing:1px;color:var(--a)}
.t9 .hd p{margin:4px 0 0;font-size:12px;letter-spacing:2px;color:#374151;font-weight:600}
.t9 .ats-c{justify-content:center}

/* t10: ATS Photo (Single Column + Right Passport Photo) */
.t10{display:grid!important;grid-template-columns:1fr 125px;grid-template-rows:auto auto 1fr;padding:40px 48px}
.t10 .hd{grid-area:1/1;padding:0 20px 14px 0;border-bottom:2px solid var(--a);margin-bottom:16px;display:flex;flex-direction:column;justify-content:center}
.t10 .ph{grid-area:1/2;background:none;padding:0 0 14px;border-bottom:2px solid var(--a);margin-bottom:16px;display:flex;justify-content:flex-end;align-items:center}
.t10 .pic{width:105px;height:120px;border-radius:6px;border:2px solid var(--a);font-size:32px}
.t10 .mn{grid-area:2/1/3/3}
.t10 .sd{grid-area:3/1/4/3}
.t10 .hd h1{font-size:28px;color:var(--a)}
.t10 .hd p{margin:4px 0 0;color:#4b5563;letter-spacing:1.5px}

/* t11: ATS Modern (Text Only - Left Aligned Corporate) */
.t11 .ph{display:none}
.t11 .hd{padding:0 0 14px;border-bottom:3px solid var(--a);margin-bottom:16px}
.t11 .hd h1{font-size:31px;text-transform:none;letter-spacing:-.5px;color:#0f172a}
.t11 .hd p{font-size:13px;letter-spacing:1px;color:var(--a);font-weight:600;margin-top:3px}
.t11 .sec h3{background:#f1f5f9;border:0;border-left:4px solid var(--a);padding:4px 10px;color:#0f172a}

/* t12: ATS Executive (Left Photo + Modern Header Box) */
.t12{display:grid!important;grid-template-columns:125px 1fr;grid-template-rows:auto auto 1fr;padding:40px 48px}
.t12 .ph{grid-area:1/1;background:#f8fafc;padding:16px 0 16px 16px;border-radius:10px 0 0 10px;border-bottom:3px solid var(--a);margin-bottom:18px;display:flex;align-items:center;justify-content:flex-start}
.t12 .pic{width:100px;height:100px;border-radius:50%;border:3px solid var(--a);font-size:30px}
.t12 .hd{grid-area:1/2;background:#f8fafc;padding:16px 20px;border-radius:0 10px 10px 0;border-bottom:3px solid var(--a);margin-bottom:18px;display:flex;flex-direction:column;justify-content:center}
.t12 .mn{grid-area:2/1/3/3}
.t12 .sd{grid-area:3/1/4/3}
.t12 .hd h1{font-size:26px;color:#0f172a}
.t12 .hd p{margin:3px 0 0;color:var(--a);letter-spacing:1.5px;font-weight:600}
</style>
</head>

function form(){

 let h=`<details open><summary>টেমপ্লেট ও রং</summary><div class="bd"><div class="tpl">${TPL.map(t=>`<button data-t="${t[0]}" class="${D.tpl==t[0]?'on':''}">${t[3]?'<span class="bdg">ATS</span>':''}<i style="background:${TH[t[0]]};border:1px solid #d9dde5"></i>${t[1]}</button>`).join('')}</div>
 <label>অ্যাকসেন্ট রং</label><input type="color" data-k="accent" value="${D.accent}"></div></details>
 <details open><summary>ব্যক্তিগত তথ্য</summary><div class="bd"><label>ছবি ${noPh?'<span style="color:#d97706;font-weight:600">(এই ATS থিমে ছবি দেখানো হয় না)</span>':''}</label><div class="photo"><input type="file" id="pf" accept="image/*"><button class="btn sec2" data-rp>মুছুন</button></div>
 ${f('name','পুরো নাম')}${f('title','পদবি / পেশা')}${f('phone','ফোন')}${f('email','ইমেইল')}${f('address','ঠিকানা')}${f('web','ওয়েবসাইট / লিংক')}${f('about','Professional Summary',1)}</div></details>`;
 for(const k in LS){const[t,fs]=LS[k];
  h+=`<details><summary>${t}</summary><div class="bd">${D[k].map((o,i)=>`<div class="row"><button class="x" data-del="${k}:${i}" aria-label="মুছুন">×</button>${fs.map(([a,l,ty])=>
   ty=='ta'?`<label>${l}</label><textarea data-l="${k}" data-i="${i}" data-k="${a}">${x(o[a])}</textarea>`:
   ty=='r'?`<label>${l}: <span>${o[a]}</span>%</label><input type="range" min="10" max="100" step="5" data-l="${k}" data-i="${i}" data-k="${a}" value="${o[a]}">`:
   `<label>${l}</label><input data-l="${k}" data-i="${i}" data-k="${a}" value="${x(o[a])}">`).join('')}</div>`).join('')}
   <button class="add" data-add="${k}">+ নতুন যোগ করুন</button></div></details>`}
 h+=`<button class="add" data-reset style="border-color:#b42318;color:#b42318;background:#fff5f5">শাহনাজের ডিফল্ট তথ্যে রিসেট করুন</button>`;
 $('#form').innerHTML=h;

const A4H=1123;
function cv(){
 const d=D,c=$('#cv');
 const isATS=['t9','t10','t11','t12'].includes(d.tpl);
 c.className='cv '+d.tpl+(isATS?' ats':'');
 c.style.setProperty('--a',d.accent);c.style.setProperty('--k',1);
 const ok=o=>Object.values(o).some(v=>String(v).trim());
 const L=(a,fn)=>a.filter(ok).map(fn).join('');
 const IC={sum:'M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-8-8V2Zm0 5a5 5 0 1 0 5 5h-2a3 3 0 1 1-3-3V7Zm0 3.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z',mon:'M3 4h18v12H3V4Zm2 2v8h14V6H5Zm4 12h6v2H9v-2Z',grad:'M12 3 1 9l11 6 9-4.9V17h2V9L12 3ZM5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8Z',case:'M9 3a2 2 0 0 0-2 2v2H3a1 1 0 0 0-1 1v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a1 1 0 0 0-1-1h-4V5a2 2 0 0 0-2-2H9Zm0 2h6v2H9V5Z',globe:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1 2.1V11H5.1A7 7 0 0 1 11 4.1ZM13 4.1A7 7 0 0 1 18.9 11H13V4.1ZM5.1 13H11v6.9A7 7 0 0 1 5.1 13Zm7.9 6.9V13h5.9A7 7 0 0 1 13 19.9Z',ppl:'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM9 13c-3 0-7 1.5-7 4v3h14v-3c0-2.5-4-4-7-4Zm7.5.1c.4 0 .8-.1 1.2-.1 2.8 0 6.3 1.4 6.3 3.8V20h-6v-3c0-1.5-.7-2.9-1.5-3.9Z'};
 const S=(t,b,ic)=>b?`<div class="sec"><h3><span class="ic"><svg viewBox="0 0 24 24"><path d="${IC[ic]||''}"/></svg></span><span>${t}</span></h3>${b}</div>`:'';
 const T3=d.tpl==='t3';
 const P={pin:'M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z',mail:'M2 5h20v14H2V5Zm2 2v.5l8 5 8-5V7H4Zm16 10V10l-8 5-8-5v7h16Z',tel:'M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z',web:'M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12ZM8 13h8v-2H8v2Zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10Z'};
 const r3=(ic,l,v)=>v?`<div><svg viewBox="0 0 24 24"><path d="${P[ic]}"/></svg><span><b>${l}:</b> ${x(v)}</span></div>`:'';
 const c3=`<div class="c3">${r3('pin','Address',d.address)}${r3('mail','Email',d.email)}${r3('tel','Phone',d.phone)}${r3('web','Web',d.web)}</div>`;
 const atsC=`<div class="ats-c">${[d.phone,d.email,d.address,d.web].filter(Boolean).map(v=>`<span>${x(v)}</span>`).join('')}</div>`;
 const bl=t=>String(t||'').split('\n').map(s=>s.replace(/^[\s·•\-]+/,'').trim()).filter(Boolean).map(s=>`<div class="bl">${x(s)}</div>`).join('');
 const ini=(d.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
 const ct=[['Phone',d.phone],['Email',d.email],['Address',d.address],['Web',d.web]].filter(a=>a[1]).map(a=>`<div><small>${a[0]}</small>${x(a[1])}</div>`).join('');

 const expH=L(d.exp,e=>isATS?`<div class="it"><div class="it-hd"><b>${x(e.role)}</b><span>${x(e.period)}</span></div>${e.org?`<i>${x(e.org)}</i>`:''}${e.desc?`<p>${x(e.desc)}</p>`:''}</div>`:`<div class="it"><b>${x(e.role)}</b><i>${[e.org,e.period].filter(Boolean).map(x).join(' | ')}</i>${e.desc?`<p>${x(e.desc)}</p>`:''}</div>`);
 const eduH=L(d.edu,e=>isATS?`<div class="it"><div class="it-hd"><b>${x(e.deg)}</b><span>${x(e.period)}</span></div>${e.inst?`<i>${x(e.inst)}</i>`:''}${e.note?`<p>${x(e.note)}</p>`:''}</div>`:`<div class="it"><b>${x(e.deg)}</b><i>${[e.inst,e.period].filter(Boolean).map(x).join(' | ')}</i>${e.note?`<p>${x(e.note)}</p>`:''}</div>`);
 const sklH=L(d.skills,s=>isATS?`<div class="bl"><b>${x(s.n)}</b> (${+s.l||0}%)</div>`:`<div class="it"><b>${x(s.n)}</b><div class="sb"><span style="width:${+s.l||0}%"></span></div></div>`);
 const tchH=L(d.tech,s=>`<div class="it${isATS?' fw':''}"><b>${x(s.n)}</b>${s.d?`<p>${x(s.d)}</p>`:''}</div>`);

 c.innerHTML=`<div class="ph"><svg class="shape" viewBox="0 0 276 262" preserveAspectRatio="none"><path class="n" d="M0 0H276C190 8 70 60 0 205Z"/><path class="a" d="M0 236C12 218 34 204 58 197"/></svg><div class="pic" style="${d.photo?`background-image:url(${d.photo})`:''}">${d.photo?'':x(ini)}</div></div>
 <div class="hd"><h1>${x(d.name||'Your Name')}</h1>${d.title?`<p>${x(d.title)}</p>`:''}${T3?c3:(isATS?atsC:'')}</div>
 <div class="sd">${T3||isATS?'':S('Contact',ct?`<div class="ct">${ct}</div>`:'')}
  ${S('Core Skills',L(d.core,s=>`<div class="bl">${x(s.n)}</div>`),'mon')}
  ${S('Skills',sklH,'mon')}
  ${S('Technical &amp; Software Skills',tchH,'mon')}
  ${S('Languages',L(d.langs,s=>`<div class="it"><b>${x(s.n)}</b><i>${x(s.l)}</i></div>`),'globe')}
  ${S('Certifications',L(d.certs,s=>`<div class="it">${x(s.n)}</div>`),'grad')}</div>
 <div class="mn">${S('Professional Summary',d.about.trim()?`<div class="about">${x(d.about)}</div>`:'','sum')}
  ${S('Academic Projects',L(d.projects,p=>`<div class="it"><b>${x(p.n)}</b>${bl(p.d)}</div>`),'case')}
  ${S('Experience',expH,'case')}
  ${S('Education',eduH,'grad')}
  ${S('References',L(d.refs,e=>`<div class="it"><b>${x(e.n)}</b><i>${x(e.t)}</i></div>`),'ppl')}</div>`;
 /* অটো ফিট: তথ্য বেশি হলে লেখা ছোট হবে (সর্বনিম্ন ০.৪৫), কম হলে বড় হবে (সর্বোচ্চ ১.২) */
 let k=1.2;c.style.setProperty('--k',k);
 while(k>0.451&&c.offsetHeight>A4H+0.5){k=Math.round((k-.01)*100)/100;c.style.setProperty('--k',k)}
 fit();
}
function fit(){const c=$('#cv'),w=$('#stage').clientWidth-24,s=Math.min(1,w/794);
 c.style.transform=`scale(${s})`;$('#box').style.width=794*s+'px';$('#box').style.height=c.offsetHeight*s+'px'}
function tab(v){document.body.className='v-'+v;$('#tE').classList.toggle('on',v=='edit');$('#tV').classList.toggle('on',v=='view');fit()}

const F=$('#form');
F.addEventListener('input',e=>{const t=e.target;if(t.type=='file')return;
 if(t.dataset.l)D[t.dataset.l][t.dataset.i][t.dataset.k]=t.value;
 else D[t.dataset.k]=t.value;
 if(t.type=='range'){const sp=t.previousElementSibling.querySelector('span');if(sp)sp.textContent=t.value}
 cv();save()});
F.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.t){D.tpl=t.dataset.t;D.accent=TPL.find(a=>a[0]==D.tpl)[2];form()}
 else if(t.dataset.add){const k=t.dataset.add;D[k].push({...LS[k][2]});form()}
 else if(t.dataset.del){const[k,i]=t.dataset.del.split(':');D[k].splice(+i,1);form()}
 else if('rp' in t.dataset)D.photo='';
 else if('reset' in t.dataset){if(!confirm('সব পরিবর্তন মুছে ডিফল্ট তথ্যে ফিরে যাবেন?'))return;D=JSON.parse(JSON.stringify(SAMPLE));form()}
 else return;
 cv();save()});
F.addEventListener('change',e=>{if(e.target.id!='pf')return;const fl=e.target.files[0];if(!fl)return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,500/Math.max(im.width,im.height)),cn=document.createElement('canvas');
  cn.width=im.width*m;cn.height=im.height*m;cn.getContext('2d').drawImage(im,0,0,cn.width,cn.height);D.photo=cn.toDataURL('image/jpeg',.85);cv();save()};im.src=r.result};r.readAsDataURL(fl)});

async function exp(type){
 /* মোবাইলে "তথ্য দিন" ট্যাবে প্রিভিউ লুকানো (display:none) থাকে, তাই সেখান থেকে ক্যাপচার করলে খালি/এরর আসত।
    সমাধান: সিভির একটি কপি স্ক্রিনের বাইরে বসিয়ে সেটা থেকে ছবি/PDF বানানো। */
 const src=$('#cv'),c=src.cloneNode(true),t='';
 c.removeAttribute('id');
 c.style.cssText+=';transform:none;position:static;box-shadow:none;width:794px;min-height:1123px';
 const wrap=document.createElement('div');
 wrap.style.cssText='position:fixed;left:-10000px;top:0;width:794px;pointer-events:none';
 wrap.appendChild(c);document.body.appendChild(wrap);
 try{await (document.fonts&&document.fonts.ready);
  await new Promise(r=>setTimeout(r,150));
  const cn=await html2canvas(c,{scale:window.innerWidth<900?1.6:2,useCORS:true,backgroundColor:'#fff',width:794,windowWidth:794,scrollX:0,scrollY:0});
  const nm=(D.name||'cv').trim().replace(/\s+/g,'_')+'_CV';
  if(type=='png'){const a=document.createElement('a');a.href=cn.toDataURL('image/png');a.download=nm+'.png';a.click();return}
  const pdf=new jspdf.jsPDF('p','mm','a4'),W=210,H=297,img=cn.toDataURL('image/jpeg',.95);
  /* একটাই A4 পেজে ফিট করে বসানো */
  const h=cn.height*W/cn.width;
  if(h<=H+0.5){pdf.addImage(img,'JPEG',0,0,W,Math.min(h,H))}
  else{const w2=cn.width*H/cn.height;pdf.addImage(img,'JPEG',(W-w2)/2,0,w2,H)}
  pdf.save(nm+'.pdf');
 }catch(err){alert('ডাউনলোড করা যায়নি। আবার চেষ্টা করুন।\n('+(err&&err.message||err)+')')}
 finally{wrap.remove()}
}
addEventListener('resize',fit);
form();cv();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(cv);
</script>
